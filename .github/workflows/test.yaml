name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        dotnet: [10.0.x]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Restore tools
        run: dotnet tool restore

      - name: Run Build
        run: dotnet build -c Debug

      # --blame-hang-* detects a hung *individual* test after 3 minutes, kills it, takes
      # a full process dump, and lets the run continue — instead of a hang silently
      # consuming the whole `timeout-minutes: 15` job budget with zero diagnostics.
      - name: Run Tests
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          CORES=$(nproc)
          WORKERS=$(( CORES / 2 ))
          if [ "$WORKERS" -lt 1 ]; then
            WORKERS=1
          fi

          echo "Total cores: $CORES, running tests with $WORKERS workers"
          dotnet test --no-build \
            --blame-hang-timeout 3m --blame-hang-dump-type full \
            --results-directory ./TestResults \
            -- NUnit.NumberOfTestWorkers=$WORKERS

      # Windows runners are more prone to CPU contention than Linux -- each concurrently
      # *loading* LspTestClient can itself burst across several cores (Roslyn/MSBuild
      # workspace load), so letting as many of those run at once as there are test workers
      # oversubscribes the 4 logical cores typical of these runners. Rather than also
      # cutting NUnit's own test parallelism (NUnit.NumberOfTestWorkers) to compensate,
      # cap concurrent LSP server processes directly via CSHARP_LS_TEST_MAX_CONCURRENT_CLIENTS
      # (see Fixtures.fs's activeClientsSemaphore).
      - name: Run Tests
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        env:
          CSHARP_LS_TEST_MAX_CONCURRENT_CLIENTS: 2
        run: |
          $cores = [int]$env:NUMBER_OF_PROCESSORS
          $workers = [Math]::Max(1, [Math]::Floor($cores / 2))

          Write-Host "Total cores: $cores, running tests with $workers workers"
          dotnet test --no-build `
            --blame-hang-timeout 3m --blame-hang-dump-type full `
            --results-directory ./TestResults `
            -- NUnit.NumberOfTestWorkers=$workers

      - name: Upload test hang/crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ matrix.os }}
          path: TestResults/**
          if-no-files-found: ignore
          retention-days: 7

  lint-and-pack:
    timeout-minutes: 15
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Run Fantomas check tests
        run: dotnet fantomas --check tests

      - name: Run Fantomas check src/CSharpLanguageServer
        run: dotnet fantomas --check src/CSharpLanguageServer

      - name: Check dotnet pack works for Release config
        run: |
          dotnet build -c Release
          dotnet pack -c Release -o release
        working-directory: src/CSharpLanguageServer
