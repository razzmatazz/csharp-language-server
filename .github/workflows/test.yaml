name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        dotnet: [10.0.x]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Restore tools
        run: dotnet tool restore

      - name: Run Build
        run: make build

      # --blame-hang-* detects a hung *individual* test after 3 minutes, kills it, takes
      # a full process dump, and lets the run continue — instead of a hang silently
      # consuming the whole `timeout-minutes: 15` job budget with zero diagnostics.
      #
      # The NUnit suite runs via `dotnet test` (VSTest); the Expecto-migrated suites
      # (currently just tests/CSharpLanguageServer.Tests/InternalTests.fs, the pilot file)
      # run separately afterwards via Expecto's own runner, for its own concurrency —
      # see `make test-nunit`/`make test-expecto` in the Makefile.
      # `shell: bash` also on Windows (Git Bash, present on GitHub-hosted runners) so both
      # OSes can share one script and both know how to drive `make`.
      - name: Run Tests
        shell: bash
        run: |
          CORES=$(nproc 2>/dev/null || echo "${NUMBER_OF_PROCESSORS:-2}")
          WORKERS=$(( CORES / 2 ))
          if [ "$WORKERS" -lt 1 ]; then
            WORKERS=1
          fi

          echo "Total cores: $CORES, running tests with $WORKERS workers"
          make test-nunit DOTNET_TEST_ARGS="--no-build --blame-hang-timeout 3m --blame-hang-dump-type full --results-directory ./TestResults -- NUnit.NumberOfTestWorkers=$WORKERS"
          make test-expecto DOTNET_RUN_ARGS="--no-build"

      - name: Upload test hang/crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ matrix.os }}
          path: TestResults/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Run Fantomas check tests
        run: dotnet fantomas --check tests

      - name: Run Fantomas check src/CSharpLanguageServer
        run: dotnet fantomas --check src/CSharpLanguageServer

      - name: Check dotnet pack works for Release config
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          dotnet build -c Release
          dotnet pack -c Release -o release
        working-directory: src/CSharpLanguageServer
