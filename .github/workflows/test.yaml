name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
        dotnet: [10.0.x]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Restore tools
        run: dotnet tool restore

      - name: Run Build
        run: dotnet build -c Debug

      # The server restores the (unrestored) fixtures as it loads them, so a cold NuGet cache
      # puts package downloads inside each test's first request, which on a CI runner can
      # outlast the test client's request timeout. Downloading them up front leaves those
      # restores as cache hits. Like the tests, this restores copies outside the repository,
      # whose Directory.*.props would otherwise apply; a failure (e.g. a Windows-only TFM on
      # Linux) only means that fixture stays cold.
      - name: Warm NuGet cache for test fixtures
        shell: bash
        run: |
          fixtures="${RUNNER_TEMP:-$(mktemp -d)}/fixtures"
          cp -R tests/CSharpLanguageServer.Tests/Fixtures "$fixtures"
          find "$fixtures" -name '*.csproj' | while read -r project; do
            dotnet restore "$project" -nodeReuse:false > /dev/null || echo "warm-up restore failed: $project"
          done
          # CodeActionTests also runs genericProject retargeted to net8.0.
          dotnet restore "$fixtures/genericProject/Project/Project.csproj" -p:TargetFramework=net8.0 -nodeReuse:false > /dev/null \
            || echo "warm-up restore failed: genericProject (net8.0)"

      # --blame-hang-* detects a hung *individual* test after 3 minutes, kills it, takes
      # a full process dump, and lets the run continue — instead of a hang silently
      # consuming the whole `timeout-minutes: 15` job budget with zero diagnostics.
      - name: Run Tests
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          CORES=$(nproc)
          WORKERS=$(( CORES / 2 ))
          if [ "$WORKERS" -lt 1 ]; then
            WORKERS=1
          fi

          echo "Total cores: $CORES, running tests with $WORKERS workers"
          dotnet test --no-build \
            --blame-hang-timeout 3m --blame-hang-dump-type full \
            --results-directory ./TestResults \
            -- NUnit.NumberOfTestWorkers=$WORKERS

      - name: Run Tests
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $cores = [int]$env:NUMBER_OF_PROCESSORS
          $workers = [Math]::Max(1, [Math]::Floor($cores / 2))

          Write-Host "Total cores: $cores, running tests with $workers workers"
          dotnet test --no-build `
            --blame-hang-timeout 3m --blame-hang-dump-type full `
            --results-directory ./TestResults `
            -- NUnit.NumberOfTestWorkers=$workers

      - name: Upload test hang/crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ matrix.os }}
          path: TestResults/**
          if-no-files-found: ignore
          retention-days: 7

  lint-and-pack:
    timeout-minutes: 15
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Run Fantomas check tests
        run: dotnet fantomas --check tests

      - name: Run Fantomas check src/CSharpLanguageServer
        run: dotnet fantomas --check src/CSharpLanguageServer

      - name: Check dotnet pack works for Release config
        run: |
          dotnet build -c Release
          dotnet pack -c Release -o release
        working-directory: src/CSharpLanguageServer
